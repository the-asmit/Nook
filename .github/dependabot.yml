# Every dependency and image in this repository is pinned to an exact
# version or digest; Dependabot proposes the bumps so pins do not go stale.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: weekly
