# Continuous integration. Every job calls the same Makefile target a
# developer runs locally, so CI and laptops cannot drift apart.
# Third-party actions are pinned to full commit SHAs (tags can be moved).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make lint
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: sqlc output matches the queries and migrations
        run: make sqlc-check
      - name: Generated protobuf code matches proto/
        run: make proto-check
      - name: OpenAPI spec is valid
        run: make openapi-lint

  proto:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # buf breaking reads the main branch from git history.
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make proto-lint
      - name: No breaking changes against main
        run: make proto-breaking BREAKING_REF=origin/main

  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # GoReleaser derives the snapshot version from git history.
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build the CLI for every OS/arch (no publish)
        run: make release-snapshot

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make test

  # Parallel jobs that together run exactly `make test-integration`: every
  # package except internal/server, and internal/server's tests in shards
  # (round-robin by name, so new tests are always included).
  integration:
    name: integration (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: packages
            target: test-integration-packages
          - group: server 1/4
            target: test-integration-server SHARD=1/4
          - group: server 2/4
            target: test-integration-server SHARD=2/4
          - group: server 3/4
            target: test-integration-server SHARD=3/4
          - group: server 4/4
            target: test-integration-server SHARD=4/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Ubuntu 24.04 forbids unprivileged user namespaces through AppArmor
      # (kernel.apparmor_restrict_unprivileged_userns=1); rootless BuildKit
      # needs them. This is the fix nook-agent prints for such nodes.
      - name: Allow unprivileged user namespaces for rootless BuildKit
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The runner's Docker daemon hosts the testcontainers services, the
      # builds and the apps; the tests install and remove iptables rules in
      # its network namespace through a helper container.
      - run: make ${{ matrix.target }}

  vuln:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make vuln

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Dockerfile cross-compiles and its final stage has no RUN steps,
      # so building arm64 on an amd64 runner needs no QEMU.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build nook-server, nook-agent, nook-gateway and nook-postgres for linux/amd64 and linux/arm64 (no push)
        # An empty DOCKER_OUTPUT builds both platforms without loading or pushing.
        run: make docker-build DOCKER_OUTPUT=
