openapi: 3.1.0
info:
  title: Nook control-plane API
  version: "1"
  summary: REST API used by the nook CLI and the dashboard.
  description: |
    All endpoints under `/api/v1` speak JSON. Request bodies must be sent with
    `Content-Type: application/json`; unknown fields are rejected.

    **Authentication.** Send either an API token
    (`Authorization: Bearer nook_pat_...`) or the browser session cookie.
    State-changing requests authenticated by the session cookie must also send
    the `X-CSRF-Token` header (value from `GET /api/v1/me`) and come from the
    Nook origin (`Origin`/`Referer`).

    **Errors** always use the envelope
    `{"error": {"code": "...", "message": "...", "request_id": "..."}}`.
    `code` is stable and machine-readable; `message` is for humans.

    **Tenant isolation.** A workspace you are not a member of is reported as
    `404 not_found`, exactly like one that does not exist.

    **Pagination.** List endpoints return `{"items": [...], "next_cursor": ...}`.
    Pass `next_cursor` back as `?cursor=` to get the next page; it is `null`
    on the last page.

    **Idempotent deletes.** Deleting a member, invitation or token that is
    already gone returns `204`. Malformed IDs return `404`.
servers:
  - url: http://localhost:8080
    description: Local development (make run-server)
security:
  - bearerToken: []
  - sessionCookie: []
tags:
  - name: auth
    description: The caller, sign-out and CLI login (device flow).
  - name: workspaces
    description: Workspaces (tenants) you belong to.
  - name: members
    description: Workspace members and their roles.
  - name: invitations
    description: Invitations that admit people to a workspace at sign-in.
  - name: tokens
    description: Personal API tokens for the CLI, scripts and CI.
  - name: admin
    description: Installation-wide user management (instance administrators only).
  - name: nodes
    description: Worker nodes and join tokens (instance administrators only).
  - name: apps
    description: Apps in a workspace (members create; admins and owners delete).
  - name: deployments
    description: Deploys of an app, their uploads, builds and build logs.
  - name: access
    description: Who may open an app through the gateway (members view; admins and owners change).
  - name: registry
    description: Endpoints used by Nook's private image registry.
  - name: internal
    description: |
      The control plane's internal API for nook-gateway: routes, visitor
      sessions and certificate storage. Authenticated with the gateways'
      shared secret; any other caller gets 404. Do not expose it publicly.
  - name: operations
    description: Health probes and metrics for orchestrators and Prometheus.

paths:
  /healthz:
    get:
      tags: [operations]
      operationId: liveness
      summary: Liveness probe (process is up)
      security: []
      responses:
        "200":
          description: The process is serving HTTP.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /readyz:
    get:
      tags: [operations]
      operationId: readiness
      summary: Readiness probe (Postgres and Redis reachable)
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: A dependency is unavailable; `failing` names it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
  /metrics:
    get:
      tags: [operations]
      operationId: metrics
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: Metrics in the Prometheus text exposition format.
          content:
            text/plain:
              schema: { type: string }

  /api/v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The authenticated user
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the credential used for this request
      description: |
        With a session cookie, ends the browser session and clears the cookie.
        With an API token, revokes that token (`nook logout` uses this).
      responses:
        "204": { description: Signed out. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/auth/device:
    post:
      tags: [auth]
      operationId: startDeviceAuthorization
      summary: Start a CLI login (OAuth 2.0 Device Authorization Grant, RFC 8628)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                client_name:
                  type: string
                  maxLength: 100
                  description: Shown on the approval page. Default "nook CLI".
      responses:
        "200":
          description: Device and user codes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceAuthorization" }
        "400": { $ref: "#/components/responses/Invalid" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/device/token:
    post:
      tags: [auth]
      operationId: pollDeviceToken
      summary: Poll for the API token of an approved CLI login
      description: |
        Returns the token exactly once, after the user approved the request.
        Until then, `400` with one of the RFC 8628 codes:
        `authorization_pending` (keep polling), `slow_down` (add 5 s to the
        interval), `access_denied`, `expired_token`; `invalid_grant` for
        unknown or already redeemed codes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_code]
              properties:
                device_code: { type: string }
      responses:
        "200":
          description: The issued API token.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, token]
                properties:
                  access_token: { type: string, pattern: "^nook_pat_[a-z2-7]{52}$" }
                  token_type: { type: string, const: Bearer }
                  token: { $ref: "#/components/schemas/Token" }
        "400":
          description: Not (yet) approved; see `error.code`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: Workspaces you belong to, ordered by slug
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of workspaces.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Workspace" } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: Create a workspace (you become its owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, slug]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                slug: { $ref: "#/components/schemas/Slug" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/workspaces/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [workspaces]
      operationId: getWorkspace
      summary: One workspace (members only)
      responses:
        "200":
          description: The workspace and your role in it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [workspaces]
      operationId: updateWorkspace
      summary: Rename a workspace (admins and owners)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [workspaces]
      operationId: deleteWorkspace
      summary: Delete a workspace (owners only)
      description: |
        A personal workspace cannot be deleted while it is its owner's only
        workspace (`409 last_workspace`).
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/workspaces/{slug}/members:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [members]
      operationId: listMembers
      summary: Members of a workspace, ordered by email
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of members.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Member" } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/workspaces/{slug}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [members]
      operationId: updateMember
      summary: Change a member's role
      description: |
        Admins and owners manage members and admins; only owners grant or
        remove the owner role; the last owner cannot be demoted
        (`409 last_owner`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "204": { description: Role changed. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [members]
      operationId: removeMember
      summary: Remove a member (or leave, with your own ID)
      responses:
        "204": { description: "Removed, or was not a member." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/workspaces/{slug}/invitations:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [invitations]
      operationId: listInvitations
      summary: Open invitations (admins and owners)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of open, unexpired invitations.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [invitations]
      operationId: createInvitation
      summary: Invite an email address (admins and owners; owner role needs an owner)
      description: |
        Nook sends no email: the person is admitted to the workspace the next
        time they sign in with this address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/workspaces/{slug}/invitations/{invitation_id}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - name: invitation_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [invitations]
      operationId: revokeInvitation
      summary: Revoke an open invitation
      responses:
        "204": { description: "Revoked, or no longer open." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      summary: Your API tokens, newest first (metadata only)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of tokens; revoked tokens are not listed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Token" } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [tokens]
      operationId: createToken
      summary: Create an API token for scripts and CI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                expires_in_days:
                  type: [integer, "null"]
                  minimum: 1
                  maximum: 366
                  description: Omit for a token that never expires.
      responses:
        "201":
          description: Created. `token` is shown only in this response.
          content:
            application/json:
              schema:
                type: object
                required: [token, metadata]
                properties:
                  token: { type: string, pattern: "^nook_pat_[a-z2-7]{52}$" }
                  metadata: { $ref: "#/components/schemas/Token" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/tokens/{token_id}:
    parameters:
      - name: token_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: Revoke one of your tokens
      responses:
        "204": { description: "Revoked, or already gone." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: Every user of the installation, ordered by email
      description: Instance administrators only.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: email
          in: query
          description: Only the user with exactly this email address.
          schema: { type: string, maxLength: 254 }
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [admin]
      operationId: updateUser
      summary: Disable or re-enable a user
      description: |
        Disabling revokes all of the user's sessions and API tokens at once.
        Re-enabling does not restore them; the user signs in again.
        Administrators cannot disable themselves (`409 cannot_disable_self`)
        or the last instance administrator (`409 last_instance_admin`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [disabled]
              properties:
                disabled: { type: boolean }
      responses:
        "200":
          description: The user's new state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/nodes:
    get:
      tags: [nodes]
      operationId: listNodes
      summary: Worker nodes, ordered by name (removed nodes are not listed)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of nodes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Node" } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/nodes/{node}:
    parameters:
      - $ref: "#/components/parameters/NodeRef"
    get:
      tags: [nodes]
      operationId: getNode
      summary: A node with its latest heartbeat and its 20 most recent state changes
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [nodes]
      operationId: removeNode
      summary: Remove a node
      description: |
        Revokes all of the node's certificates and ends its agent's stream;
        the agent's next connection is rejected. The name becomes free for a
        new node. A node that is already removed returns `404`.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/nodes/{node}/inspect:
    parameters:
      - $ref: "#/components/parameters/NodeRef"
    post:
      tags: [nodes]
      operationId: inspectNode
      summary: Ask the node's agent for live Docker information
      description: |
        Sends a command to the agent over its stream (through whichever
        control-plane instance it is connected to) and waits for exactly one
        answer. `503 node_not_connected`: no agent stream; `503
        agent_disconnected`: the stream ended before the answer; `503
        docker_unavailable`: the agent cannot reach Docker; `504
        command_timeout`: no answer in time.
      responses:
        "200":
          description: The agent's answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeInspection" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/nodes/{node}/drain:
    parameters:
      - $ref: "#/components/parameters/NodeRef"
    post:
      tags: [nodes]
      operationId: drainNode
      summary: Mark a node as draining (no new work is placed on it)
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/nodes/{node}/undrain:
    parameters:
      - $ref: "#/components/parameters/NodeRef"
    post:
      tags: [nodes]
      operationId: undrainNode
      summary: Return a draining node to service
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/join-tokens:
    get:
      tags: [nodes]
      operationId: listJoinTokens
      summary: Join tokens, newest first (metadata only)
      description: Usable tokens, plus those that expired or were revoked in the last day.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of join tokens.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      items: { type: array, items: { $ref: "#/components/schemas/JoinToken" } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [nodes]
      operationId: createJoinToken
      summary: Create a join token for adding worker nodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                max_uses: { type: integer, minimum: 1, maximum: 1000, default: 1 }
                expires_in_seconds: { type: integer, minimum: 60, maximum: 604800, default: 3600 }
      responses:
        "201":
          description: Created. `token` is shown only in this response.
          content:
            application/json:
              schema:
                type: object
                required: [token, server, ca_hash, join_command, metadata]
                properties:
                  token: { type: string, pattern: "^nook_join_[a-z2-7]{52}$" }
                  server: { type: string, description: "gRPC address agents connect to (host:port)." }
                  ca_hash:
                    type: string
                    pattern: "^sha256:[0-9a-f]{64}$"
                    description: Fingerprint of the agent CA certificate, for pinning.
                  join_command: { type: string, description: Ready to run on the new node. }
                  metadata: { $ref: "#/components/schemas/JoinToken" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/join-tokens/{token_id}:
    parameters:
      - name: token_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [nodes]
      operationId: revokeJoinToken
      summary: Revoke a join token
      responses:
        "204": { description: "Revoked, or already gone." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/workspaces/{slug}/apps:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [apps]
      operationId: listApps
      summary: The workspace's apps, ordered by slug
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of apps.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      items: { type: array, items: { $ref: "#/components/schemas/App" } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [apps]
      operationId: createApp
      summary: Create an app (any member)
      description: |
        Omitted settings take the defaults (port 8080, health check `/`,
        256 MB, 500 millicores). Memory and CPU are bounded by the
        installation's maxima. The workspace's app quota applies
        (`409 quota_exceeded`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug]
              properties:
                slug: { $ref: "#/components/schemas/AppSlug" }
                name: { type: string, maxLength: 100 }
                port: { type: integer, minimum: 1, maximum: 65535 }
                health_check_path: { type: string, pattern: "^/", maxLength: 200 }
                memory_mb: { type: integer, minimum: 16 }
                cpu_millicores: { type: integer, minimum: 10 }
                startup_timeout_seconds: { type: integer, minimum: 1, description: "Default 60; at most the installation's maximum." }
                read_only_rootfs: { type: boolean }
                sleep_after: { type: string, description: 'Idle time before the app sleeps, e.g. "15m" (the default), or "never"; within the installation''s minimum and maximum.' }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/workspaces/{slug}/apps/{app}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/AppSlug"
    get:
      tags: [apps]
      operationId: getApp
      summary: An app with what runs it
      responses:
        "200":
          description: The app, its live deployment and instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [apps]
      operationId: updateApp
      summary: Change an app's settings (any member)
      description: |
        Omitted fields stay as they are. The settings apply to the next
        instance started (the next deployment, a rollback or a restart).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                port: { type: integer, minimum: 1, maximum: 65535 }
                health_check_path: { type: string, pattern: "^/", maxLength: 200 }
                memory_mb: { type: integer, minimum: 16 }
                cpu_millicores: { type: integer, minimum: 10 }
                startup_timeout_seconds: { type: integer, minimum: 1 }
                read_only_rootfs: { type: boolean }
                sleep_after: { type: string, description: 'A duration such as "15m", or "never".' }
      responses:
        "200":
          description: The app after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppDetail" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
    delete:
      tags: [apps]
      operationId: deleteApp
      summary: Delete an app (workspace admins and owners)
      description: |
        Waiting deployments are cancelled and a running build is stopped.
        The app's images, source archives and build logs are purged in the
        background; its slug is free at once.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/workspaces/{slug}/apps/{app}/stop:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/AppSlug"
    post:
      tags: [apps]
      operationId: stopApp
      summary: Stop the app (any member)
      description: |
        Sets the desired state to stopped: the instance is stopped and new
        deployments wait (status `built`) until the app is started again.
      responses:
        "200":
          description: The app after the request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/workspaces/{slug}/apps/{app}/start:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/AppSlug"
    post:
      tags: [apps]
      operationId: startApp
      summary: Start the app (any member)
      description: |
        Sets the desired state to running: the newest deployment waiting to
        be released is rolled out, otherwise the live deployment gets a new
        instance (also after a crash loop).
      responses:
        "200":
          description: The app after the request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/workspaces/{slug}/apps/{app}/wake:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/AppSlug"
    post:
      tags: [apps]
      operationId: wakeApp
      summary: Wake a sleeping app (any member)
      description: |
        Idle apps sleep after their `sleep_after` without requests; the next
        request through the gateway wakes them, and so does this call. One
        wake happens however many requests or calls arrive at once. The
        instance resumes on its previous node when that node has room
        (container and image still there), otherwise it is placed anew.
      responses:
        "202":
          description: The app after the request ("waking", or "running" if it was awake).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/workspaces/{slug}/apps/{app}/rollback:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/AppSlug"
    post:
      tags: [deployments]
      operationId: rollback
      summary: Release an earlier deployment again (any member)
      description: |
        Creates a deployment of kind `rollback` with the image and the
        environment snapshot of deployment `to` (default: the newest earlier
        deployment that was live) and rolls it out like any release. The
        replaced deployment ends as `rolled_back`. Conflicts:
        `no_rollback_target`, `not_built`, `image_deleted`, `already_live`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                to: { type: integer, minimum: 0, description: "Deployment number; 0 or omitted picks the previous live one." }
      responses:
        "201":
          description: The rollback deployment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/workspaces/{slug}/apps/{app}/logs:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/AppSlug"
    get:
      tags: [apps]
      operationId: getAppLogs
      summary: The app's runtime output (Server-Sent Events)
      description: |
        Streams the output of the app's newest instance from the node that
        runs it, wherever the node's agent is connected: `line` events
        (`{"time", "stream", "text"}`, stream `stdout` or `stderr`) and a
        final `end` (`{"reason"}`). Without `follow` the stream ends with
        the retained output. Requests are rate-limited per user, and each is
        limited in size and duration by the installation.
      parameters:
        - name: follow
          in: query
          schema: { type: string, enum: ["1", "true"] }
        - name: tail
          in: query
          description: Lines from the end to start with (0 = everything retained).
          schema: { type: integer, minimum: 0, maximum: 10000 }
        - name: since
          in: query
          description: A duration such as `10m`, or an RFC 3339 time.
          schema: { type: string }
      responses:
        "200":
          description: The output.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/workspaces/{slug}/apps/{app}/env:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/AppSlug"
    get:
      tags: [apps]
      operationId: listEnv
      summary: The app's environment variables (secret values are never returned)
      responses:
        "200":
          description: The variables, ordered by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EnvVar" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [apps]
      operationId: setEnv
      summary: Set environment variables
      description: |
        Members may set plain variables; setting a secret (`secret: true`) or
        overwriting one needs a workspace admin or owner. Names follow POSIX
        (`[A-Za-z_][A-Za-z0-9_]*`, at most 128 characters); `PORT`,
        `NOOK_APP`, `NOOK_DEPLOYMENT` and every `NOOK_` name are reserved.
        Values are at most 32 KiB; an app has at most 200 variables of
        256 KiB in total. Values are encrypted at rest. If the app is live,
        a deployment of kind `config` (same image, new environment, no
        rebuild) is created and rolled out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [vars]
              properties:
                vars: { type: object, additionalProperties: { type: string }, minProperties: 1, maxProperties: 50 }
                secret: { type: boolean }
      responses:
        "200":
          description: The variables after the change and the deployment releasing them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvChange" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/workspaces/{slug}/apps/{app}/env/{key}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/AppSlug"
      - name: key
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]{0,127}$" }
    delete:
      tags: [apps]
      operationId: unsetEnv
      summary: Remove an environment variable (secrets need an admin or owner)
      responses:
        "200":
          description: The variables after the change and the deployment releasing them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvChange" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/workspaces/{slug}/apps/{app}/access:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/AppSlug"
    get:
      tags: [access]
      operationId: getAccess
      summary: Who may open the app through the gateway (members)
      responses:
        "200":
          description: The access policy and its grants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Access" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [access]
      operationId: setAccess
      summary: Set the access mode (admins and owners)
      description: |
        `workspace` (default): every member of the workspace. `restricted`:
        admins, owners and the granted emails. `public`: anyone, without
        signing in; refused with 403 unless the instance sets
        `NOOK_ALLOW_PUBLIC_APPS=true`. Grants also apply in `workspace`
        mode, so outsiders can be let in. Audit-logged as `access.set_mode`.
        Gateways apply the change within their access cache (30 s by default).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode: { type: string, enum: [workspace, restricted, public] }
      responses:
        "200":
          description: The policy after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Access" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/workspaces/{slug}/apps/{app}/access/grants:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/AppSlug"
    post:
      tags: [access]
      operationId: grantAccess
      summary: Grant access to emails (admins and owners)
      description: |
        Emails need no Nook account: visitors sign in with the identity
        provider and are matched by verified email (case-insensitive). At
        most 50 emails per request and 1000 per app. Granting an email
        twice is not an error. Audit-logged as `access.grant`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [emails]
              properties:
                emails:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string, format: email, maxLength: 254 }
      responses:
        "200":
          description: The policy after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Access" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/workspaces/{slug}/apps/{app}/access/grants/{email}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/AppSlug"
      - name: email
        in: path
        required: true
        schema: { type: string, maxLength: 254 }
    delete:
      tags: [access]
      operationId: revokeAccess
      summary: Revoke an email's access (admins and owners)
      description: Audit-logged as `access.revoke`. 404 when the email has no grant.
      responses:
        "200":
          description: The policy after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Access" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/workspaces/{slug}/apps/{app}/deployments:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/AppSlug"
    get:
      tags: [deployments]
      operationId: listDeployments
      summary: An app's deployments, newest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of deployments (without their build attempts).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Deployment" } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [deployments]
      operationId: createDeployment
      summary: Start a deploy and get the upload URL for its source archive
      description: |
        Announce the size and SHA-256 of the gzip-compressed tar archive of
        the project. The response's presigned URL accepts exactly that
        content (the storage service verifies length and checksum) for a
        short time; upload it there directly with the given method and
        headers, then call `upload-complete`. The URL is a credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_size, source_sha256]
              properties:
                source_size: { type: integer, minimum: 1 }
                source_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "201":
          description: Created; upload the archive next.
          content:
            application/json:
              schema:
                type: object
                required: [deployment, upload, max_source_bytes]
                properties:
                  deployment: { $ref: "#/components/schemas/Deployment" }
                  upload:
                    type: object
                    required: [url, method, headers, expires_at]
                    properties:
                      url: { type: string, format: uri }
                      method: { type: string, enum: [PUT] }
                      headers: { type: object, additionalProperties: { type: string } }
                      expires_at: { type: string, format: date-time }
                  max_source_bytes: { type: integer }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/workspaces/{slug}/apps/{app}/deployments/{number}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/AppSlug"
      - $ref: "#/components/parameters/DeploymentNumber"
    get:
      tags: [deployments]
      operationId: getDeployment
      summary: A deployment with its build attempts
      responses:
        "200":
          description: The deployment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/workspaces/{slug}/apps/{app}/deployments/{number}/upload-complete:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/AppSlug"
      - $ref: "#/components/parameters/DeploymentNumber"
    post:
      tags: [deployments]
      operationId: confirmUpload
      summary: Confirm the upload and queue the build
      description: |
        The control plane checks that the archive is in storage with exactly
        the announced size and SHA-256 before queueing (`409 upload_missing`,
        `409 upload_mismatch`). Queueing cancels older queued deployments of
        the same app; if a newer one is already queued, this one is
        cancelled instead.
      responses:
        "200":
          description: Queued (or cancelled as superseded).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/workspaces/{slug}/apps/{app}/deployments/{number}/cancel:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/AppSlug"
      - $ref: "#/components/parameters/DeploymentNumber"
    post:
      tags: [deployments]
      operationId: cancelDeployment
      summary: Cancel a waiting or building deployment
      description: |
        A deployment that has not started building is cancelled at once. A
        running build is stopped on its node; the deployment reports
        `cancel_requested` until it ends as `cancelled`. Finished
        deployments answer `409 already_finished`.
      responses:
        "200":
          description: The deployment after the request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/workspaces/{slug}/apps/{app}/deployments/{number}/build-log:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/AppSlug"
      - $ref: "#/components/parameters/DeploymentNumber"
    get:
      tags: [deployments]
      operationId: getBuildLog
      summary: A deployment's build log, complete or live
      description: |
        Without `follow`, the whole log as text. With `follow=1`, a stream
        of Server-Sent Events: `line` (`{"text": ...}`) for each line of
        output, `status` (`{"status": ...}`) when the deployment's status
        changes, and a final `end` carrying the Deployment. Followers on any
        control-plane instance receive the output of builds whose agent is
        connected to any other instance. Comment lines keep idle
        connections open.
      parameters:
        - name: follow
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: The log.
          content:
            text/plain:
              schema: { type: string }
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/workspaces/{slug}/quota:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [admin]
      operationId: getQuota
      summary: A workspace's quota (instance administrators)
      responses:
        "200":
          description: The effective quota.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quota" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: setQuota
      summary: Override a workspace's quota (instance administrators)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [max_apps, max_concurrent_builds]
              properties:
                max_apps: { type: integer, minimum: 0, maximum: 10000 }
                max_concurrent_builds: { type: integer, minimum: 0, maximum: 100 }
                max_memory_mb: { type: integer, minimum: 0, maximum: 10485760, description: Omitted keeps the current memory quota. }
      responses:
        "200":
          description: The new quota.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quota" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/registry/gc-window/open:
    post:
      tags: [registry]
      operationId: openGCWindow
      summary: Open a registry maintenance window (registry GC job only)
      description: |
        Authenticated with `Authorization: Bearer <NOOK_REGISTRY_GC_SECRET>`.
        Granted once no build is running (waits up to a minute); while it is
        open no build starts, so garbage collection cannot race a push.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ttl_seconds]
              properties:
                ttl_seconds: { type: integer, minimum: 60, maximum: 1800 }
      responses:
        "200":
          description: The window is open.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ttl_seconds: { type: integer }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/registry/gc-window/close:
    post:
      tags: [registry]
      operationId: closeGCWindow
      summary: Close the registry maintenance window (registry GC job only)
      security: []
      responses:
        "204": { description: Closed; builds resume. }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /internal/v1/routes:
    get:
      tags: [internal]
      operationId: listRoutes
      summary: Every app's route (gateways only)
      security: [{ gatewaySecret: [] }]
      responses:
        "200":
          description: The route table.
          content:
            application/json:
              schema:
                type: object
                required: [routes]
                properties:
                  routes: { type: array, items: { $ref: "#/components/schemas/Route" } }
        "404": { description: Not a gateway (the internal API does not reveal itself). }

  /internal/v1/routes/{app_id}:
    parameters:
      - name: app_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [internal]
      operationId: getRoute
      summary: One app's route, after a route event (gateways only)
      security: [{ gatewaySecret: [] }]
      responses:
        "200":
          description: The route.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Route" }
        "404": { description: The app does not exist (or not a gateway). }

  /internal/v1/apps/{app_id}/wake:
    parameters:
      - name: app_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [internal]
      operationId: wakeAppForGateway
      summary: Wake a sleeping app for a held request (gateways only)
      description: Idempotent; exactly one wake happens across all gateways (a compare-and-set).
      security: [{ gatewaySecret: [] }]
      responses:
        "202":
          description: '"waking" (this call woke it) or "awake" (it was awake or being woken).'
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: { type: string, enum: [waking, awake] }
        "404": { description: The app does not exist (or not a gateway). }

  /internal/v1/tls/hosts/{host}:
    parameters:
      - name: host
        in: path
        required: true
        schema: { type: string, maxLength: 253 }
    get:
      tags: [internal]
      operationId: knownHost
      summary: Whether a certificate may be obtained for a host (on-demand TLS "ask" check)
      security: [{ gatewaySecret: [] }]
      responses:
        "204": { description: The auth host or an existing app's host. }
        "404": { description: Unknown host (or not a gateway). }

  /internal/v1/visitor/exchange:
    post:
      tags: [internal]
      operationId: exchangeVisitorCode
      summary: Redeem a sign-in code for an app-host session (gateways only)
      description: |
        Codes are single-use, expire after a minute and are bound to the
        app host they were issued for.
      security: [{ gatewaySecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, host]
              properties:
                code: { type: string, maxLength: 128 }
                host: { type: string, maxLength: 253 }
      responses:
        "200":
          description: The session token (shown once) for a host-only cookie.
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at, return_path]
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
                  return_path: { type: string }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { description: Not a gateway. }

  /internal/v1/visitor/check:
    post:
      tags: [internal]
      operationId: checkVisitorSession
      summary: Validate a visitor session and decide access to its host (gateways only)
      security: [{ gatewaySecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, host]
              properties:
                token: { type: string, maxLength: 128 }
                host: { type: string, maxLength: 253 }
      responses:
        "200":
          description: "`ok` (proxy, with the identity), `denied` (403) or `invalid` (sign in again)."
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok, denied, invalid] }
                  email: { type: string }
                  name: { type: string }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { description: Not a gateway. }

  /internal/v1/visitor/sign-out:
    post:
      tags: [internal]
      operationId: signOutVisitor
      summary: Revoke an app-host session (gateways only)
      security: [{ gatewaySecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, maxLength: 128 }
      responses:
        "204": { description: Revoked (or already gone). }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { description: Not a gateway. }

  /internal/v1/certificates/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._+-]{0,252}$" }
    get:
      tags: [internal]
      operationId: getCertificate
      summary: A stored ACME certificate or account key (gateways only)
      security: [{ gatewaySecret: [] }]
      responses:
        "200":
          description: The data, decrypted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "404": { description: Nothing stored under this name (or not a gateway). }
    put:
      tags: [internal]
      operationId: putCertificate
      summary: Store an ACME certificate or account key, sealed with the secrets keyring (gateways only)
      security: [{ gatewaySecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Certificate" }
      responses:
        "204": { description: Stored. }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { description: Not a gateway. }
    delete:
      tags: [internal]
      operationId: deleteCertificate
      summary: Remove a stored certificate (gateways only)
      security: [{ gatewaySecret: [] }]
      responses:
        "204": { description: Removed (or already gone). }
        "404": { description: Not a gateway. }

components:
  securitySchemes:
    gatewaySecret:
      type: http
      scheme: bearer
      description: The gateways' shared secret (`NOOK_GATEWAY_SECRET`); internal API only.
    bearerToken:
      type: http
      scheme: bearer
      description: A personal access token (`nook_pat_...`).
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-nook_session
      description: |
        Browser session (named `nook_session` on plain-HTTP localhost in
        development). Unsafe methods also need the `X-CSRF-Token` header.

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Slug" }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    NodeRef:
      name: node
      in: path
      required: true
      description: The node's name or ID.
      schema: { type: string, maxLength: 63 }
    AppSlug:
      name: app
      in: path
      required: true
      schema: { $ref: "#/components/schemas/AppSlug" }
    DeploymentNumber:
      name: number
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema: { type: string, maxLength: 512 }

  responses:
    Invalid:
      description: Invalid input.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: Missing, invalid, expired or revoked credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        Not allowed: insufficient role (`forbidden`,
        `instance_admin_required`) or failed CSRF check (`csrf_failed`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Does not exist, or belongs to a workspace you are not in.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicts with current state (e.g. `slug_taken`, `last_owner`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests; see the `Retry-After` header.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: |
        A dependency of the request is not available right now (for node
        commands: `node_not_connected`, `agent_disconnected`,
        `docker_unavailable`, `agent_error`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Timeout:
      description: The work did not finish in time (`command_timeout`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: The body was not sent as application/json.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
    Page:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array }
        next_cursor: { type: [string, "null"] }
    Slug:
      type: string
      pattern: "^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$"
    Role:
      type: string
      enum: [owner, admin, member]
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, unavailable] }
        failing:
          type: array
          items: { type: string }
    User:
      type: object
      required: [id, email, name, avatar_url, is_instance_admin, created_at, last_login_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        avatar_url: { type: string }
        is_instance_admin: { type: boolean }
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, "null"], format: date-time }
    Me:
      type: object
      required: [user, auth_method]
      properties:
        user: { $ref: "#/components/schemas/User" }
        auth_method: { type: string, enum: [session, token] }
        csrf_token:
          type: string
          description: Present for session authentication; send as X-CSRF-Token.
    Workspace:
      type: object
      required: [id, name, slug, personal, role, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { $ref: "#/components/schemas/Slug" }
        personal: { type: boolean }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
    Member:
      type: object
      required: [user, role, joined_at]
      properties:
        user:
          type: object
          required: [id, email, name, avatar_url]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            name: { type: string }
            avatar_url: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        joined_at: { type: string, format: date-time }
    Invitation:
      type: object
      required: [id, email, role, invited_by, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        invited_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    Token:
      type: object
      required: [id, name, prefix, created_at, last_used_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: "First characters, e.g. nook_pat_ab3d" }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
    DeviceAuthorization:
      type: object
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
      properties:
        device_code: { type: string, description: Secret; only the CLI keeps it. }
        user_code: { type: string, pattern: "^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}$" }
        verification_uri: { type: string, format: uri }
        verification_uri_complete: { type: string, format: uri }
        expires_in: { type: integer, description: Seconds until the codes expire. }
        interval: { type: integer, description: Minimum seconds between polls. }
    AdminUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [disabled_at]
          properties:
            disabled_at: { type: [string, "null"], format: date-time }
    NodeStatus:
      type: string
      enum: [joining, ready, suspect, dead, draining, removed]
    Heartbeat:
      type: object
      required: [received_at, memory_available_bytes, cpu_load_1m, disk_free_bytes, running_containers, docker_reachable, agent_version, uptime_seconds]
      properties:
        received_at: { type: string, format: date-time, description: Control-plane time of receipt. }
        memory_available_bytes: { type: integer, format: int64 }
        cpu_load_1m: { type: number }
        disk_free_bytes: { type: integer, format: int64 }
        running_containers: { type: integer }
        docker_reachable: { type: boolean }
        agent_version: { type: string }
        uptime_seconds: { type: integer, format: int64 }
        builds_unavailable_reason: { type: string }
    Node:
      type: object
      required: [id, name, status, draining, labels, hostname, addresses, cpu_count, memory_total_bytes, disk_total_bytes, docker_version, agent_version, os, arch, joined_at, last_heartbeat_at, heartbeat]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" }
        status: { $ref: "#/components/schemas/NodeStatus" }
        draining: { type: boolean }
        labels: { type: object, additionalProperties: { type: string } }
        hostname: { type: string }
        addresses: { type: array, items: { type: string } }
        cpu_count: { type: integer }
        memory_total_bytes: { type: integer, format: int64 }
        disk_total_bytes: { type: integer, format: int64 }
        docker_version: { type: string }
        agent_version: { type: string }
        os: { type: string }
        arch: { type: string }
        advertise_address: { type: string, description: Private address apps are published on. }
        build_slots: { type: integer }
        builds_unavailable_reason: { type: string, description: "Why the node cannot build, with the fix; empty when it can." }
        joined_at: { type: string, format: date-time }
        last_heartbeat_at: { type: [string, "null"], format: date-time }
        heartbeat:
          oneOf:
            - $ref: "#/components/schemas/Heartbeat"
            - type: "null"
    NodeDetail:
      allOf:
        - $ref: "#/components/schemas/Node"
        - type: object
          required: [events, active_instances]
          properties:
            active_instances: { type: integer, description: App instances still running or stopping on the node (zero once a drain is complete). }
            events:
              type: array
              description: Most recent first.
              items:
                type: object
                required: [from, to, reason, at]
                properties:
                  from:
                    oneOf:
                      - $ref: "#/components/schemas/NodeStatus"
                      - type: "null"
                  to: { $ref: "#/components/schemas/NodeStatus" }
                  reason: { type: string }
                  at: { type: string, format: date-time }
    NodeInspection:
      type: object
      required: [node, docker, containers]
      properties:
        node: { type: string }
        docker:
          type: object
          required: [server_version, api_version, operating_system, kernel_version, architecture, cpus, memory_total_bytes, storage_driver, containers_running, containers_total, images]
          properties:
            server_version: { type: string }
            api_version: { type: string }
            operating_system: { type: string }
            kernel_version: { type: string }
            architecture: { type: string }
            cpus: { type: integer }
            memory_total_bytes: { type: integer, format: int64 }
            storage_driver: { type: string }
            containers_running: { type: integer }
            containers_total: { type: integer }
            images: { type: integer }
        containers:
          type: array
          description: Containers carrying the label `nook.managed=true`.
          items:
            type: object
            required: [id, name, image, state, status, labels, created_at]
            properties:
              id: { type: string }
              name: { type: string }
              image: { type: string }
              state: { type: string }
              status: { type: string }
              labels: { type: object, additionalProperties: { type: string } }
              created_at: { type: string, format: date-time }
    JoinToken:
      type: object
      required: [id, prefix, max_uses, uses, created_by, created_at, expires_at, last_used_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        prefix: { type: string, description: "First characters, e.g. nook_join_ab3d" }
        max_uses: { type: integer }
        uses: { type: integer }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
    AppSlug:
      type: string
      pattern: "^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$"
    Access:
      type: object
      required: [mode, effective, public_allowed, grants]
      properties:
        mode: { type: string, enum: [workspace, restricted, public] }
        effective:
          type: string
          enum: [workspace, restricted, public]
          description: What applies; `public` falls back to `workspace` where the instance forbids public apps.
        public_allowed: { type: boolean }
        grants:
          type: array
          items:
            type: object
            required: [email, created_at]
            properties:
              email: { type: string }
              created_at: { type: string, format: date-time }
    Route:
      type: object
      required: [app_id, host, workspace, app, access, state]
      properties:
        app_id: { type: string, format: uuid }
        host: { type: string }
        workspace: { type: string }
        app: { type: string }
        access: { type: string, enum: [workspace, restricted, public], description: The effective mode. }
        state: { type: string, enum: [running, unhealthy, starting, crashed, stopped, not_deployed, sleeping, waking] }
        upstream: { type: string, description: "The instance's node address:port, when it is served." }
    Certificate:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: string, contentEncoding: base64, maxLength: 87384 }
    App:
      type: object
      required: [id, slug, name, port, health_check_path, memory_mb, cpu_millicores, deployments, created_at]
      properties:
        id: { type: string, format: uuid }
        slug: { $ref: "#/components/schemas/AppSlug" }
        name: { type: string }
        port: { type: integer }
        health_check_path: { type: string }
        memory_mb: { type: integer }
        cpu_millicores: { type: integer }
        startup_timeout_seconds: { type: integer }
        read_only_rootfs: { type: boolean }
        desired_state: { type: string, enum: [running, stopped] }
        url: { type: string, format: uri, description: "Where visitors open the app: <scheme>://<app>--<workspace>.<apps domain>/" }
        access_mode: { type: string, enum: [workspace, restricted, public] }
        sleep_after: { type: string, description: 'Idle time before the app sleeps ("15m"), or "never".' }
        deployments: { type: integer, description: Number of deployments so far. }
        created_at: { type: string, format: date-time }
    AppDetail:
      allOf:
        - $ref: "#/components/schemas/App"
        - type: object
          required: [live_deployment, health, instance]
          properties:
            live_deployment: { type: [integer, "null"] }
            health: { type: string, enum: [running, starting, unhealthy, crashed, sleeping, waking, stopped, not_deployed] }
            sleeping_since: { type: [string, "null"], format: date-time }
            sleep_reason: { type: string, enum: [idle, evicted], description: Set while the app sleeps. }
            last_request_at: { type: [string, "null"], format: date-time, description: When the gateways last saw a request for the app. }
            instance:
              oneOf:
                - $ref: "#/components/schemas/Instance"
                - type: "null"
    Instance:
      type: object
      required: [node, state, address, host_port, restart_count, last_error, started_at, last_healthy_at, created_at]
      properties:
        node: { type: string }
        state: { type: string, enum: [starting, healthy, unhealthy, stopping, stopped, crashed, failed, sleeping] }
        address: { type: string, description: The node's advertise address. }
        host_port: { type: [integer, "null"] }
        restart_count: { type: integer }
        last_error: { type: string }
        started_at: { type: [string, "null"], format: date-time }
        last_healthy_at: { type: [string, "null"], format: date-time }
        startup_log: { type: string, description: Output of an instance that failed to start. }
        created_at: { type: string, format: date-time }
    EnvVar:
      type: object
      required: [key, value, secret, updated_at]
      properties:
        key: { type: string }
        value: { type: [string, "null"], description: Null for secrets. }
        secret: { type: boolean }
        updated_at: { type: string, format: date-time }
    EnvChange:
      type: object
      required: [items, deployment]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/EnvVar" } }
        deployment:
          oneOf:
            - $ref: "#/components/schemas/Deployment"
            - type: "null"
    DeploymentStatus:
      type: string
      enum: [pending, uploading, queued, building, built, deploying, live, failed, superseded, rolled_back, cancelled]
    Build:
      type: object
      required: [attempt, node, dispatched_at, started_at, finished_at, result, message]
      properties:
        attempt: { type: integer }
        node: { type: string }
        dispatched_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        result:
          type: [string, "null"]
          enum: [succeeded, failed, timed_out, cancelled, infra_error, lost, null]
        message: { type: string }
    Deployment:
      type: object
      required: [number, status, source_size, source_sha256, image_digest, image, failure_reason, cancel_requested, created_at,
        queued_at, building_at, built_at, failed_at, canceled_at, image_deleted]
      properties:
        number: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/DeploymentStatus" }
        source_size: { type: integer }
        source_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        image_digest: { type: [string, "null"], pattern: "^sha256:[0-9a-f]{64}$" }
        image:
          type: [string, "null"]
          description: The image by digest, e.g. registry:5000/<workspace-id>/<app-id>@sha256:...
        failure_reason: { type: string }
        cancel_requested: { type: boolean }
        created_at: { type: string, format: date-time }
        queued_at: { type: [string, "null"], format: date-time }
        building_at: { type: [string, "null"], format: date-time }
        built_at: { type: [string, "null"], format: date-time }
        failed_at: { type: [string, "null"], format: date-time }
        canceled_at: { type: [string, "null"], format: date-time }
        image_deleted: { type: boolean, description: The image was removed by retention. }
        builds: { type: array, items: { $ref: "#/components/schemas/Build" } }
        kind: { type: string, enum: [build, config, rollback] }
        rollback_to: { type: [integer, "null"] }
        deploying_at: { type: [string, "null"], format: date-time }
        live_at: { type: [string, "null"], format: date-time }
        superseded_at: { type: [string, "null"], format: date-time }
        rolled_back_at: { type: [string, "null"], format: date-time }
        instance: { $ref: "#/components/schemas/Instance" }
    Quota:
      type: object
      required: [max_apps, max_concurrent_builds, max_memory_mb, default]
      properties:
        max_apps: { type: integer }
        max_concurrent_builds: { type: integer }
        max_memory_mb: { type: integer, description: Memory the workspace's running instances may reserve. }
        default: { type: boolean, description: True when the instance defaults apply. }
