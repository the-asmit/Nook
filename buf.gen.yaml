# Generates Go code next to the .proto files. The plugins are installed at
# pinned versions into bin/ by `make proto`, which puts them on PATH.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/the-asmit/nook/proto
plugins:
  - local: protoc-gen-go
    out: proto
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: proto
    opt: paths=source_relative
