# Local development dependencies for Nook: Postgres, Redis, MinIO, the
# private image registry (with its garbage-collection job) and the Dex
# development identity provider. Start with `make dev-up`.
#
# Every image is pinned to an exact tag plus its multi-arch index digest, so
# all developers (and CI) run byte-identical images on amd64 and arm64.
# Credentials come from the repository's .env file (`make env` creates or
# updates it with random passwords); compose refuses to start if any is missing.
# Ports are published on 127.0.0.1 only, never on the LAN.

name: nook-dev

services:
  postgres:
    image: postgres:18.7-trixie@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data in a version-specific subdirectory
      # of /var/lib/postgresql, which makes major-version upgrades possible.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine3.23@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    # Append-only persistence so queued jobs survive a container restart.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      # Lets redis-cli in the healthcheck authenticate without putting the
      # password on its command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    # Upstream MinIO stopped publishing container images in late 2025, so
    # this is Chainguard's build from the MinIO source (amd64 + arm64).
    # Chainguard publishes only a moving "latest" tag for free, so the
    # digest is the pin. See docs/decisions/0007-dev-stack-images.md.
    image: cgr.dev/chainguard/minio:latest@sha256:bd92a45b821c0d85772c607ed7b49693efe78b3ffffae301b5d1b0981660de22
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      # Alias used by the healthcheck; readiness endpoints need no credentials.
      MC_HOST_local: http://127.0.0.1:9000
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio-init:
    # Creates the buckets once MinIO is up, then exits.
    image: cgr.dev/chainguard/minio:latest@sha256:bd92a45b821c0d85772c607ed7b49693efe78b3ffffae301b5d1b0981660de22
    entrypoint: ["mc"]
    # mc keeps its config under /tmp: the root file system is read-only.
    command: ["--config-dir", "/tmp/mc", "mb", "--ignore-existing", "local/nook", "local/nook-registry"]
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    depends_on:
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  registry:
    # Nook's private image registry: TLS from Nook's CA (make dev-up issues
    # the certificate), token authentication, images stored in MinIO.
    image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
    user: "${NOOK_DEV_UID:?run make env}:${NOOK_DEV_GID:?run make env}"
    environment:
      REGISTRY_STORAGE_S3_ACCESSKEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      REGISTRY_STORAGE_S3_SECRETKEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - ./registry/config.yml:/etc/distribution/config.yml:ro
      - ../../.nook-dev/registry:/certs:ro
    ports:
      - "127.0.0.1:${REGISTRY_PORT:-5000}:5000"
    networks:
      default:
        ipv4_address: 172.31.250.10
    depends_on:
      minio-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5001/debug/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  registry-gc:
    # Deletes blobs no image references any more, inside a maintenance
    # window the control plane grants while no build is pushing.
    image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
    user: "${NOOK_DEV_UID:?run make env}:${NOOK_DEV_GID:?run make env}"
    entrypoint: ["sh", "/etc/distribution/gc.sh"]
    environment:
      REGISTRY_STORAGE_S3_ACCESSKEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      REGISTRY_STORAGE_S3_SECRETKEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      NOOK_REGISTRY_GC_SECRET: ${NOOK_REGISTRY_GC_SECRET:?run make env}
      # The control plane runs on the host during development (make run-server).
      NOOK_CONTROL_PLANE_URL: http://host.docker.internal:8080
      NOOK_REGISTRY_GC_INTERVAL: "3600"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./registry/config.yml:/etc/distribution/config.yml:ro
      - ./registry/gc.sh:/etc/distribution/gc.sh:ro
      - ../../.nook-dev/registry:/certs:ro
    depends_on:
      registry:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  dex:
    # DEVELOPMENT ONLY: a real OpenID Connect provider with static test
    # users, so sign-in works without a Google account. See dex/config.yaml.
    image: ghcr.io/dexidp/dex:v2.46.1@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab
    # The image's entrypoint renders *.yaml arguments with gomplate first.
    command: ["dex", "serve", "/etc/dex/nook-dev.yaml"]
    environment:
      DEX_ISSUER: ${NOOK_OIDC_ISSUER_URL:?set NOOK_OIDC_ISSUER_URL in .env}
      DEX_NOOK_CLIENT_ID: ${NOOK_OIDC_CLIENT_ID:?set NOOK_OIDC_CLIENT_ID in .env}
      DEX_NOOK_CLIENT_SECRET: ${DEX_NOOK_CLIENT_SECRET:?set DEX_NOOK_CLIENT_SECRET in .env}
      DEX_NOOK_REDIRECT_URI: ${NOOK_PUBLIC_URL:?set NOOK_PUBLIC_URL in .env}/auth/callback
      DEX_ALICE_PASSWORD_HASH: ${DEX_ALICE_PASSWORD_HASH:?run make env}
      DEX_BOB_PASSWORD_HASH: ${DEX_BOB_PASSWORD_HASH:?run make env}
      DEX_MALLORY_PASSWORD_HASH: ${DEX_MALLORY_PASSWORD_HASH:?run make env}
    volumes:
      - ./dex/config.yaml:/etc/dex/nook-dev.yaml:ro
    ports:
      - "127.0.0.1:${DEX_PORT:-5556}:5556"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5556/dex/.well-known/openid-configuration"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  default:
    # A fixed name lets `make docker-run` attach the server container.
    name: nook-dev
    # A fixed subnet gives the registry a fixed address, which the dev
    # agent maps "registry" to for builds (NOOK_AGENT_BUILD_HOSTS) and
    # allows through its egress firewall.
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  postgres-data:
  redis-data:
  minio-data:
