# Nook project configuration. `nook deploy` reads it from this folder.
# A notes app backed by PostgreSQL: after the first deploy, run
#   nook db create notes-go
# and the app gets DATABASE_URL (it is redeployed without a rebuild).
app = "notes-go"
# The port your app listens on inside its container.
port = 8080
# Path that answers 2xx when the app is healthy (it does not need the
# database, so a database outage does not restart the app).
health_check_path = "/healthz"
# Resource limits: memory in MB, CPU in millicores (1000 = one CPU).
memory_mb = 64
cpu_millicores = 250
