syntax = "proto3";

// Package nook.agent.v1 is the protocol between a worker node's nook-agent
// and the Nook control plane. It runs only over TLS 1.3; every RPC except
// Join requires a client certificate issued by the control plane's
// internal certificate authority.
package nook.agent.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// NodeService is served by every control-plane instance on its gRPC port.
service NodeService {
  // Join exchanges a one-time join token and a certificate signing request
  // for a node identity and a short-lived client certificate. It is the
  // only RPC callable without a client certificate. The agent pins the
  // control plane's CA (by fingerprint) before sending the token.
  rpc Join(JoinRequest) returns (JoinResponse);

  // Connect is the long-lived session between an agent and the control
  // plane. The agent first sends a Hello, then heartbeats and command
  // results; the control plane answers with a ConnectAccepted, then sends
  // commands. Either side may end the stream; the agent reconnects.
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);

  // RenewCertificate issues a fresh certificate for a new key, authenticated
  // by the node's current certificate, which is revoked once the new one is
  // issued.
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
}

// NodeInfo describes a node's fixed properties, reported at join and on
// every connection.
message NodeInfo {
  string hostname = 1;
  // Addresses the node can be reached at (no loopback addresses).
  repeated string addresses = 2;
  int32 cpu_count = 3;
  int64 memory_total_bytes = 4;
  int64 disk_total_bytes = 5;
  // Empty when the Docker engine is unreachable.
  string docker_version = 6;
  string agent_version = 7;
  // GOOS and GOARCH of the agent, e.g. "linux" and "arm64".
  string os = 8;
  string arch = 9;
  // How many builds the agent runs at once; 0 means it does not build.
  int32 build_slots = 10;
  // The node's private address that apps are published on (never a
  // wildcard address); the gateway reaches apps through it.
  string advertise_address = 11;
  // Why the node cannot run builds even though it has build slots (with
  // the fix), or empty when it can.
  string builds_unavailable_reason = 12;
  // Where app containers reach an app database server on this node, the
  // port it is published on, and why the node cannot host one (with the
  // fix), or empty when it can.
  string database_address = 13;
  string database_publish_address = 14;
  int32 database_port = 15;
  string database_unavailable_reason = 16;
}

message JoinRequest {
  // The nook_join_... token printed by `nook node join-token create`.
  string join_token = 1;
  // PKCS #10 certificate signing request (DER) for a key generated on the
  // node. The private key itself never leaves the node.
  bytes csr_der = 2;
  // Requested node name; defaults to the hostname. Lower-case letters,
  // digits and inner hyphens, at most 63 characters.
  string name = 3;
  map<string, string> labels = 4;
  NodeInfo info = 5;
}

message JoinResponse {
  string node_id = 1;
  string name = 2;
  // The node's client certificate (DER), signed by the Nook CA.
  bytes certificate_der = 3;
  // The Nook CA certificate (DER) the agent must trust from now on.
  bytes ca_certificate_der = 4;
}

message RenewCertificateRequest {
  // CSR (DER) for a freshly generated key.
  bytes csr_der = 1;
}

message RenewCertificateResponse {
  bytes certificate_der = 1;
  bytes ca_certificate_der = 2;
}

// ConnectRequest is one message from the agent on the Connect stream.
message ConnectRequest {
  oneof message {
    // First message of every stream.
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    CommandResult command_result = 3;
    // Output of a running build, in order.
    BuildLog build_log = 4;
    // How a build ended; sent once per build, after its last BuildLog.
    BuildFinished build_finished = 5;
    // A change in the state of an app instance on the node.
    InstanceStatus instance_status = 6;
    // Output of an app's container for a log stream the control plane
    // opened with StreamLogsCommand.
    AppLog app_log = 7;
    // A change in the state of the app database server on the node.
    DatabaseStatus database_status = 8;
    // How a base backup ended.
    DatabaseBackupFinished database_backup_finished = 9;
    // How a step of a database dump ended.
    DatabaseDumpFinished database_dump_finished = 10;
  }
}

// ConnectResponse is one message from the control plane on the Connect stream.
message ConnectResponse {
  oneof message {
    // Answer to Hello.
    ConnectAccepted accepted = 1;
    Command command = 2;
  }
}

message Hello {
  NodeInfo info = 1;
  // Builds the agent is still running (or has results for). A build the
  // control plane assigned to this node that is missing here was lost.
  repeated string active_build_ids = 2;
  // App instances whose containers exist on the node. The control plane
  // removes those it no longer wants and restarts those it wants that are
  // missing or not running.
  repeated InstanceReport instances = 3;
  // App database server containers on the node. The control plane stops
  // those that are no longer current (fencing) and starts the current one
  // if it is not running.
  repeated DatabaseReport databases = 4;
}

message ConnectAccepted {
  string node_id = 1;
  // How often the agent must send heartbeats.
  google.protobuf.Duration heartbeat_interval = 2;
  // The instances the control plane has on the node, with their restart
  // counts, so a restarted agent continues counting where it left off.
  repeated KnownInstance instances = 3;
  // The app database server app containers may connect to (none if
  // unset); the egress firewall allows exactly this address and port.
  DatabaseEndpoint database_endpoint = 4;
}

message KnownInstance {
  string instance_id = 1;
  int32 restart_count = 2;
}

// Heartbeat reports live resource usage. The control plane timestamps it
// on receipt with its own clock; the agent's clock is never trusted.
message Heartbeat {
  int64 memory_available_bytes = 1;
  // One-minute load average.
  double cpu_load_1m = 2;
  int64 disk_free_bytes = 3;
  int32 running_containers = 4;
  string agent_version = 5;
  google.protobuf.Duration uptime = 6;
  // False when the agent cannot reach its Docker engine.
  bool docker_reachable = 7;
  // Why builds cannot run on the node (with the fix), or empty.
  string builds_unavailable_reason = 8;
}

// Command asks the agent to do something and answer with exactly one
// CommandResult carrying the same command_id.
message Command {
  string command_id = 1;
  // How long the agent may take before the control plane gives up.
  google.protobuf.Duration timeout = 2;
  oneof kind {
    InspectNodeCommand inspect_node = 3;
    BuildCommand build = 4;
    CancelBuildCommand cancel_build = 5;
    StartInstanceCommand start_instance = 6;
    StopInstanceCommand stop_instance = 7;
    StreamLogsCommand stream_logs = 8;
    StopLogsCommand stop_logs = 9;
    StartDatabaseCommand start_database = 10;
    StopDatabaseCommand stop_database = 11;
    BackupDatabaseCommand backup_database = 12;
    DumpDatabaseCommand dump_database = 13;
    UploadDumpCommand upload_dump = 14;
    UpdateDatabaseTLSCommand update_database_tls = 15;
    SetDatabaseEndpointCommand set_database_endpoint = 16;
  }
}

// InspectNodeCommand asks for live Docker engine information and the
// containers Nook manages on the node.
message InspectNodeCommand {}

message CommandResult {
  string command_id = 1;
  oneof result {
    CommandError error = 2;
    InspectNodeResult inspect_node = 3;
    // The command was accepted; its outcome is reported separately (for a
    // build: BuildLog and BuildFinished messages).
    Accepted accepted = 4;
  }
}

message Accepted {}

message CommandError {
  CommandErrorCode code = 1;
  // Human-readable explanation, safe to show to an administrator.
  string message = 2;
}

enum CommandErrorCode {
  COMMAND_ERROR_CODE_UNSPECIFIED = 0;
  // The agent does not know the command (it is older than the control plane).
  COMMAND_ERROR_CODE_UNSUPPORTED = 1;
  // The Docker engine could not be reached.
  COMMAND_ERROR_CODE_DOCKER_UNAVAILABLE = 2;
  // The command ran out of time on the agent.
  COMMAND_ERROR_CODE_TIMEOUT = 3;
  COMMAND_ERROR_CODE_FAILED = 4;
  // The agent has no free build slot.
  COMMAND_ERROR_CODE_BUSY = 5;
}

message InspectNodeResult {
  DockerInfo docker = 1;
  // Containers carrying the label nook.managed=true.
  repeated ManagedContainer containers = 2;
}

message DockerInfo {
  string server_version = 1;
  string api_version = 2;
  string operating_system = 3;
  string kernel_version = 4;
  string architecture = 5;
  int32 cpus = 6;
  int64 memory_total_bytes = 7;
  string storage_driver = 8;
  int32 containers_running = 9;
  int32 containers_total = 10;
  int32 images = 11;
}

message ManagedContainer {
  string id = 1;
  string name = 2;
  string image = 3;
  // Docker state, e.g. "running" or "exited".
  string state = 4;
  // Human-readable status, e.g. "Up 5 minutes".
  string status = 5;
  map<string, string> labels = 6;
  google.protobuf.Timestamp created_at = 7;
}

// BuildCommand asks the agent to build an image from uploaded source and
// push it to Nook's registry. The agent answers with Accepted at once and
// reports progress with BuildLog and BuildFinished.
message BuildCommand {
  string build_id = 1;
  string deployment_id = 2;
  int32 attempt = 3;
  // Presigned GET URL of the source archive (tar.gz); short-lived, secret.
  string source_url = 4;
  // Expected SHA-256 (hex) and size of the archive.
  string source_sha256 = 5;
  int64 source_size = 6;
  // Registry host:port as reachable from the node.
  string registry = 7;
  // Repository and tag to push, e.g. "<workspace-id>/<app-id>" and "b-<build-id>".
  string repository = 8;
  string tag = 9;
  // Short-lived registry bearer token allowing push and pull on repository and
  // cache_repository only; secret.
  string registry_token = 10;
  // Limits for the build container.
  google.protobuf.Duration timeout = 11;
  int64 memory_bytes = 12;
  int64 cpu_millicores = 13;
  int64 max_log_bytes = 14;
  // The app's build-cache repository in the registry (registry_token also
  // covers it): BuildKit imports and exports its layer cache there
  // (<registry>/<cache_repository>:buildcache). Empty: build without a
  // cache.
  string cache_repository = 15;
}

// CancelBuildCommand stops a running build; the agent answers with
// Accepted and then reports BuildFinished with result CANCELED.
message CancelBuildCommand {
  string build_id = 1;
}

message BuildLog {
  string build_id = 1;
  // Complete lines of output, without trailing newlines.
  repeated string lines = 2;
}

message BuildFinished {
  string build_id = 1;
  BuildResult result = 2;
  // Digest of the pushed image manifest ("sha256:..."), for SUCCEEDED.
  string image_digest = 3;
  // Short explanation shown to the user; never contains secrets.
  string message = 4;
  // Bytes of log output produced (counting what was dropped beyond the limit).
  int64 log_bytes = 5;
}

enum BuildResult {
  BUILD_RESULT_UNSPECIFIED = 0;
  BUILD_RESULT_SUCCEEDED = 1;
  // The user's build failed (a Dockerfile step, a missing base image, ...).
  BUILD_RESULT_FAILED = 2;
  BUILD_RESULT_TIMED_OUT = 3;
  BUILD_RESULT_CANCELED = 4;
  // Something outside the user's control failed (download, Docker, push);
  // the control plane retries on another node.
  BUILD_RESULT_INFRA_ERROR = 5;
}

// StartInstanceCommand asks the agent to run an app instance: pull the
// image by digest, create a locked-down container publishing the app's
// port on the node's advertise address, start it and report HEALTHY once
// its health check answers 2xx, or FAILED. It is idempotent by
// instance_id: an instance that exists is started again if it stopped.
message StartInstanceCommand {
  string instance_id = 1;
  string deployment_id = 2;
  string app_id = 3;
  string workspace_id = 4;
  // For labels and messages only.
  string app_slug = 5;
  int32 deployment_number = 6;
  // registry/repository@image_digest is the image; the token grants pull
  // access to that repository only and expires soon.
  string registry = 7;
  string repository = 8;
  string image_digest = 9;
  string registry_token = 10;
  // The port the app listens on inside the container.
  int32 port = 11;
  string health_check_path = 12;
  // How long the instance may take to answer its health check.
  google.protobuf.Duration startup_timeout = 13;
  int64 memory_bytes = 14;
  int64 cpu_millicores = 15;
  bool read_only_rootfs = 16;
  // The environment, decrypted by the control plane for this command
  // only. Never logged by either side.
  repeated EnvVar env = 17;
}

message EnvVar {
  string name = 1;
  string value = 2;
}

// StopInstanceCommand stops and removes an instance's container after
// letting it serve for drain (zero: at once). The agent reports STOPPED.
message StopInstanceCommand {
  string instance_id = 1;
  google.protobuf.Duration drain = 2;
  // Stop the container but keep it (an app going to sleep): a later
  // StartInstance for the same instance starts it again, image and all,
  // without creating anything.
  bool keep_container = 3;
}

// StreamLogsCommand asks for an instance's container output, sent as
// AppLog messages with stream_id until the output ends (follow false),
// max_bytes were sent, max_duration passed or StopLogsCommand arrives.
message StreamLogsCommand {
  string stream_id = 1;
  string instance_id = 2;
  bool follow = 3;
  // Lines from the end to start with (0: all retained output).
  int32 tail = 4;
  // Only output after this time.
  google.protobuf.Timestamp since = 5;
  int64 max_bytes = 6;
  google.protobuf.Duration max_duration = 7;
}

message StopLogsCommand {
  string stream_id = 1;
}

enum InstanceState {
  INSTANCE_STATE_UNSPECIFIED = 0;
  // The container was created and is starting; its health check has not
  // passed yet.
  INSTANCE_STATE_STARTING = 1;
  // Running and its health check passed.
  INSTANCE_STATE_HEALTHY = 2;
  // The container crashed; the agent restarts it after a backoff.
  INSTANCE_STATE_UNHEALTHY = 3;
  // The container was stopped and removed as asked.
  INSTANCE_STATE_STOPPED = 4;
  // The container crashed too often; the agent no longer restarts it.
  INSTANCE_STATE_CRASHED = 5;
  // The instance never became healthy; its container was removed.
  INSTANCE_STATE_FAILED = 6;
}

// InstanceStatus reports a change of an instance's state.
message InstanceStatus {
  string instance_id = 1;
  InstanceState state = 2;
  string container_id = 3;
  // The port published on the advertise address.
  int32 host_port = 4;
  int32 restart_count = 5;
  // Why the instance is unhealthy, crashed or failed (user-facing).
  string message = 6;
  // For FAILED: the container's last output before it was removed.
  repeated string startup_log = 7;
}

// InstanceReport describes an instance container found on the node.
message InstanceReport {
  string instance_id = 1;
  string container_id = 2;
  bool running = 3;
  int32 host_port = 4;
  int32 restart_count = 5;
  // Whether the agent is currently stopping the container.
  bool stopping = 6;
}

// AppLog carries container output for a log stream.
message AppLog {
  string stream_id = 1;
  repeated LogLine lines = 2;
  // The stream ended; message says why if it was not the end of output.
  bool end = 3;
  string message = 4;
}

message LogLine {
  google.protobuf.Timestamp time = 1;
  // "stdout" or "stderr".
  string stream = 2;
  string text = 3;
}

// DatabaseEndpoint is where the current app database server listens.
message DatabaseEndpoint {
  string address = 1;
  int32 port = 2;
}

// StartDatabaseCommand asks the agent to run the app database server
// (image nook-postgres) on its volume, publishing it on the node's
// database address and port, and to report RUNNING once it accepts
// connections and has finished recovering, or FAILED. Idempotent by
// server_id: a server that runs is left alone; a stopped one is
// recreated with this command's settings on the same volume.
message StartDatabaseCommand {
  string server_id = 1;
  // Image reference (pinned by digest outside development).
  string image = 2;
  // "init", "restore" or "existing" (see nook-db.sh).
  string mode = 3;
  int64 memory_bytes = 4;
  int64 cpu_millicores = 5;
  // The server's environment (settings, certificate and key, storage
  // credentials, backup encryption key), built by the control plane for
  // this command only. Never logged by either side.
  repeated EnvVar env = 6;
}

// StopDatabaseCommand stops the server's container and reports STOPPED.
// With final_archive, the server is shut down cleanly and the WAL it had
// not archived yet is pushed (no data loss), and the report names the
// last segment. With remove, the container and its volume are deleted.
message StopDatabaseCommand {
  string server_id = 1;
  bool final_archive = 2;
  bool remove = 3;
}

// BackupDatabaseCommand asks for a base backup, then deletes backups and
// WAL no longer needed to restore any point after retain_after (keeping
// at least one backup). Reported with DatabaseBackupFinished.
message BackupDatabaseCommand {
  string server_id = 1;
  google.protobuf.Timestamp retain_after = 2;
}

// DumpDatabaseCommand asks for a plain-SQL pg_dump of one database into a
// file on the node (at most max_bytes); reported with DatabaseDumpFinished
// (stage DUMPED) carrying its size and SHA-256.
message DumpDatabaseCommand {
  string dump_id = 1;
  string server_id = 2;
  string database = 3;
  int64 max_bytes = 4;
}

// UploadDumpCommand sends a finished dump to the presigned URL (which
// accepts exactly that file) and deletes it from the node; reported with
// DatabaseDumpFinished (stage UPLOADED).
message UploadDumpCommand {
  string dump_id = 1;
  string url = 2;
  map<string, string> headers = 3;
}

// UpdateDatabaseTLSCommand replaces the running server's certificate.
message UpdateDatabaseTLSCommand {
  string server_id = 1;
  string certificate_pem = 2;
  string private_key_pem = 3;
}

// SetDatabaseEndpointCommand changes the endpoint app containers may
// reach (an empty address: none).
message SetDatabaseEndpointCommand {
  DatabaseEndpoint endpoint = 1;
}

enum DatabaseState {
  DATABASE_STATE_UNSPECIFIED = 0;
  // Starting or restoring.
  DATABASE_STATE_STARTING = 1;
  // Accepting connections, recovery finished.
  DATABASE_STATE_RUNNING = 2;
  // The container was stopped (and removed, if asked).
  DATABASE_STATE_STOPPED = 3;
  // The server could not start, or exited.
  DATABASE_STATE_FAILED = 4;
}

// DatabaseStatus reports a change of the server's state.
message DatabaseStatus {
  string server_id = 1;
  DatabaseState state = 2;
  // Where apps reach it (RUNNING).
  string address = 3;
  int32 port = 4;
  // Why it failed (user-facing).
  string message = 5;
  // STOPPED with final_archive: the last WAL segment pushed.
  string final_wal = 6;
}

message DatabaseBackupFinished {
  string server_id = 1;
  bool ok = 2;
  string backup_name = 3;
  string message = 4;
}

enum DumpStage {
  DUMP_STAGE_UNSPECIFIED = 0;
  DUMP_STAGE_DUMPED = 1;
  DUMP_STAGE_UPLOADED = 2;
}

message DatabaseDumpFinished {
  string dump_id = 1;
  DumpStage stage = 2;
  bool ok = 3;
  int64 size_bytes = 4;
  bytes sha256 = 5;
  string message = 6;
}

// DatabaseReport describes an app database server container on the node.
message DatabaseReport {
  string server_id = 1;
  bool running = 2;
  // A base backup of this server is running on the node.
  bool backup_running = 3;
}
